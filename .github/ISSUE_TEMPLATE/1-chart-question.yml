name: Thắc mắc kết quả lập lá số / Chart result question
description: Thấy một lá số lập chưa đúng? Hãy kèm thông tin ngày sinh và kết quả đối chiếu để chúng tôi kiểm tra từng mục.
title: "[Thắc mắc lá số] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Chỉ ghi “không chuẩn” thì chúng tôi không có cách nào kiểm tra. Hãy điền đầy đủ theo mẫu dưới đây, chúng tôi sẽ đối chiếu từng mục.
        Xem qua trước: độ sáng phụ tinh, quy thuộc tháng nhuận, giờ Tý muộn có đổi ngày hay không vốn khác nhau giữa các trường phái; những khác biệt này không tính là bug, nhưng vẫn hoan nghênh bạn chỉ ra.
  - type: input
    id: date
    attributes:
      label: Ngày sinh (dương lịch)
      placeholder: "Ví dụ: 1990-05-12"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Giờ sinh (giờ, phút)
      placeholder: "Ví dụ: 08:30"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Nơi sinh hoặc kinh độ
      description: Dùng để quy đổi giờ mặt trời thật (chân thái dương thời); chênh lệch kinh độ theo hướng Đông–Tây có thể làm lệch tới một canh giờ.
      placeholder: "Ví dụ: Hàng Châu, Chiết Giang / kinh độ Đông 120.2°"
  - type: dropdown
    id: gender
    attributes:
      label: Giới tính
      options: ["Nam", "Nữ"]
    validations:
      required: true
  - type: textarea
    id: ours
    attributes:
      label: Kết quả do dự án này lập ra
      description: Ảnh chụp màn hình, hoặc dán các mục liên quan trong đầu ra của generateChart.
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Đối chiếu với nguồn nào
      placeholder: "Ví dụ: phần mềm lập lá số khác / trang mấy của một cuốn sách"
    validations:
      required: true
  - type: textarea
    id: theirs
    attributes:
      label: Kết quả đối chiếu
      description: Ảnh chụp màn hình hoặc văn bản.
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: Cụ thể mục nào không khớp
      placeholder: "Ví dụ: cung Mệnh lẽ ra ở Mão, ở đây lại xếp ở Tuất"
    validations:
      required: true
