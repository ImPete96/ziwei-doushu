name: Đề xuất tính năng / Feature request
description: Tính năng mới hoặc cải tiến bạn muốn có
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Muốn giải quyết vấn đề gì
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Cách làm bạn hình dung
  - type: textarea
    id: source
    attributes:
      label: Căn cứ (hãy ghi khi liên quan đến chuẩn mệnh lý)
      description: Xuất xứ từ cuốn sách nào, bài giảng nào, hoặc thiết lập nào của phần mềm lập lá số nào. Thay đổi chuẩn không có xuất xứ thì chúng tôi thường không nhận.
