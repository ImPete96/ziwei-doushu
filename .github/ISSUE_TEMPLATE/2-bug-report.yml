name: Lỗi chương trình / Bug report
description: Mã không chạy được, báo lỗi, trang hiển thị bất thường
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Xác nhận trước: bản mã nguồn mở **không có** bất kỳ API backend `/api/*` nào (luận giải AI, phân tích xem hợp đôi); các tính năng này trả về 404 là hành vi được dự kiến, bạn cần tự hiện thực, xem mục “Bắt đầu nhanh” trong README. Bản thân việc lập lá số không cần API Key.
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. npm ci
        2. npm run dev
        3. Mở /chart, chọn …… bấm ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế (thông báo lỗi, ảnh chụp màn hình)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Môi trường chạy
      placeholder: "Ví dụ: macOS 15 / Node 22 / Chrome 140"
