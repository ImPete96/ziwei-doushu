name: Vấn đề trên site chính thức / ouranic.cn issue
description: Vấn đề đăng nhập, thanh toán, hiển thị… trên website trực tuyến (ouranic.cn)
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Địa chỉ trang gặp vấn đề
      placeholder: https://ouranic.cn/……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Vấn đề xảy ra như thế nào
      placeholder: Đã bấm gì, đã điền gì, thấy thông báo lỗi gì
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Trình duyệt và hệ điều hành
      placeholder: "Ví dụ: Windows 11 / Chrome 153 / mạng công ty có bật proxy"
  - type: textarea
    id: screenshot
    attributes:
      label: Ảnh chụp màn hình
      description: Xin đừng đăng số điện thoại, mã xác minh, ngày giờ sinh của người khác hay thông tin riêng tư khác.
