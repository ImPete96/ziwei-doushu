name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 排盘回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo đã commit package-lock.json: cài theo phiên bản đã khóa, và bật cache npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cài dependency
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Hồi quy engine lập lá số
        run: npm test
